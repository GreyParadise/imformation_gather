<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #0f1319;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    padding: 24px;
  }
  h1 { color: #e8ecf1; font-size: 22px; font-weight: 600; letter-spacing: 2px; }
  p.caption { color: #8b95a3; font-size: 13px; }
  .stage {
    width: min(92vw, 900px);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,.55);
    background: #7ec8f2;
  }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <h1>鹈鹕骑自行车</h1>
  <div class="stage">
    <svg id="scene" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车的动画">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5db3e8"/>
          <stop offset="1" stop-color="#c9e9f7"/>
        </linearGradient>
        <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#fff3b0" stop-opacity=".9"/>
          <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- 背景 -->
      <rect x="0" y="0" width="800" height="402" fill="url(#sky)"/>
      <circle cx="706" cy="66" r="70" fill="url(#sunGlow)"/>
      <circle cx="706" cy="66" r="30" fill="#ffd75e"/>
      <path d="M-40,402 Q140,300 340,402 Z" fill="#8fbf86"/>
      <path d="M420,402 Q620,290 840,402 Z" fill="#79ac70"/>
      <path d="M180,402 Q380,320 600,402 Z" fill="#84b67c"/>

      <!-- 云 -->
      <g class="cloud" fill="#ffffff" opacity="0.9">
        <ellipse cx="0" cy="0" rx="46" ry="16"/>
        <ellipse cx="34" cy="-8" rx="30" ry="13"/>
        <ellipse cx="-30" cy="-6" rx="26" ry="11"/>
      </g>
      <g class="cloud" fill="#ffffff" opacity="0.75">
        <ellipse cx="0" cy="0" rx="56" ry="18"/>
        <ellipse cx="42" cy="-10" rx="34" ry="14"/>
        <ellipse cx="-40" cy="-8" rx="28" ry="12"/>
      </g>
      <g class="cloud" fill="#ffffff" opacity="0.65">
        <ellipse cx="0" cy="0" rx="36" ry="12"/>
        <ellipse cx="26" cy="-7" rx="22" ry="10"/>
      </g>

      <!-- 速度线 -->
      <line class="streak" y1="132" y2="132" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
      <line class="streak" y1="226" y2="226" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
      <line class="streak" y1="316" y2="316" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

      <!-- 地面 -->
      <rect x="0" y="400" width="800" height="80" fill="#4c525b"/>
      <line x1="0" y1="401.5" x2="800" y2="401.5" stroke="#616978" stroke-width="3"/>
      <line id="roadDash" x1="0" y1="446" x2="800" y2="446" stroke="#e6d28a" stroke-width="5"
            stroke-dasharray="40 30"/>

      <!-- 远侧腿（先画，被车挡住） -->
      <g stroke-linecap="round" fill="none">
        <line id="crankFar" stroke="#9ea6b0" stroke-width="5"/>
        <line id="pedFar" stroke="#2b2f36" stroke-width="5"/>
        <line id="thighF" stroke="#d97a1e" stroke-width="7" opacity="0.85"/>
        <line id="shankF" stroke="#d97a1e" stroke-width="6" opacity="0.85"/>
      </g>
      <polygon id="footF" fill="#d97a1e" opacity="0.85"/>

      <!-- 自行车 -->
      <g>
        <!-- 后轮 -->
        <g id="wheelRear">
          <circle cx="200" cy="340" r="60" fill="none" stroke="#20242a" stroke-width="8"/>
          <circle cx="200" cy="340" r="60" fill="none" stroke="#3a4048" stroke-width="8" stroke-dasharray="10 14"/>
          <g stroke="#9aa3ad" stroke-width="3">
            <line x1="142" y1="340" x2="258" y2="340"/>
            <line x1="200" y1="282" x2="200" y2="398"/>
            <line x1="159" y1="299" x2="241" y2="381"/>
            <line x1="241" y1="299" x2="159" y2="381"/>
          </g>
          <circle cx="200" cy="340" r="7" fill="#5b636d"/>
        </g>
        <!-- 前轮 -->
        <g id="wheelFront">
          <circle cx="430" cy="340" r="60" fill="none" stroke="#20242a" stroke-width="8"/>
          <circle cx="430" cy="340" r="60" fill="none" stroke="#3a4048" stroke-width="8" stroke-dasharray="10 14"/>
          <g stroke="#9aa3ad" stroke-width="3">
            <line x1="372" y1="340" x2="488" y2="340"/>
            <line x1="430" y1="282" x2="430" y2="398"/>
            <line x1="389" y1="299" x2="471" y2="381"/>
            <line x1="471" y1="299" x2="389" y2="381"/>
          </g>
          <circle cx="430" cy="340" r="7" fill="#5b636d"/>
        </g>

        <!-- 链条与牙盘 -->
        <path d="M200,332 L300,326 M200,348 L300,354" stroke="#767d86" stroke-width="3" fill="none"/>
        <circle cx="200" cy="340" r="9" fill="none" stroke="#888f98" stroke-width="3"/>
        <circle id="chainring" cx="300" cy="340" r="14" fill="none" stroke="#888f98" stroke-width="4" stroke-dasharray="4 4"/>

        <!-- 车架 -->
        <g stroke="#d94f4f" stroke-width="6" stroke-linecap="round" fill="none">
          <line x1="200" y1="340" x2="300" y2="340"/>
          <line x1="262" y1="248" x2="300" y2="340"/>
          <line x1="200" y1="340" x2="262" y2="248"/>
          <line x1="300" y1="340" x2="402" y2="246"/>
          <line x1="262" y1="248" x2="402" y2="246"/>
          <line x1="402" y1="246" x2="430" y2="340"/>
        </g>
        <!-- 车把与车座 -->
        <line x1="402" y1="246" x2="412" y2="224" stroke="#2c2f36" stroke-width="5" stroke-linecap="round"/>
        <circle cx="413" cy="222" r="5" fill="#2c2f36"/>
        <path d="M246,244 L284,246 Q268,258 248,252 Z" fill="#2c2f36"/>
      </g>

      <!-- 鹈鹕 -->
      <g id="pelican">
        <!-- 尾羽 -->
        <path d="M236,256 Q202,244 192,252 Q208,262 204,274 Q224,274 238,266 Z" fill="#d8d2c4"/>
        <!-- 身体 -->
        <ellipse cx="272" cy="266" rx="50" ry="35" fill="#edeae0" transform="rotate(-12 272 266)"/>
        <!-- 翅膀 -->
        <g id="wing">
          <path d="M256,250 Q236,256 230,272 Q258,282 290,268 Q304,256 298,244 Q278,240 256,250 Z" fill="#d8d2c4"/>
          <g stroke="#b3aa98" stroke-width="2.5" fill="none" stroke-linecap="round">
            <path d="M242,264 Q258,268 278,260"/>
            <path d="M236,271 Q256,276 282,266"/>
          </g>
        </g>
        <!-- 脖子 -->
        <path d="M292,250 C298,216 306,204 326,199" stroke="#edeae0" stroke-width="17" fill="none" stroke-linecap="round"/>
        <!-- 头部（含嘴与喉囊） -->
        <g id="headG">
          <path d="M322,186 Q318,176 326,174 Q330,180 328,186 Z" fill="#d8d2c4"/>
          <circle cx="330" cy="198" r="15" fill="#edeae0"/>
          <path d="M340,192 Q374,197 406,206 L402,213 Q370,206 341,201 Z" fill="#f4a836"/>
          <path d="M341,201 Q362,240 400,211 Q366,222 344,206 Z" fill="#f7c969"/>
          <circle cx="334" cy="194" r="2.8" fill="#22252b"/>
        </g>
      </g>

      <!-- 近侧腿（最上层） -->
      <g stroke-linecap="round" fill="none">
        <line id="crankNear" stroke="#c6ccd4" stroke-width="5"/>
        <line id="pedNear" stroke="#2b2f36" stroke-width="5"/>
        <line id="thighN" stroke="#f28c28" stroke-width="7"/>
        <line id="shankN" stroke="#f28c28" stroke-width="6"/>
      </g>
      <polygon id="footN" fill="#f28c28"/>
    </svg>
  </div>
  <p class="caption">SVG + JavaScript · 脚踏的腿部运动为实时 IK 解算 —— 向 Edward Tufte 致敬</p>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var wheelR = $('wheelRear'), wheelF = $('wheelFront'), ring = $('chainring');
  var cn = $('crankNear'), cf = $('crankFar'), pn = $('pedNear'), pf = $('pedFar');
  var tn = $('thighN'), sn = $('shankN'), fn = $('footN');
  var tf = $('thighF'), sf = $('shankF'), ff = $('footF');
  var pel = $('pelican'), wing = $('wing'), head = $('headG');
  var road = $('roadDash');
  var clouds = document.querySelectorAll('.cloud');
  var streaks = document.querySelectorAll('.streak');

  var CX = 300, CY = 340, CR = 26;   // 中轴位置与曲柄半径
  var L1 = 42, L2 = 46;              // 大腿 / 小腿长度

  function setLine(el, x1, y1, x2, y2) {
    el.setAttribute('x1', x1.toFixed(1)); el.setAttribute('y1', y1.toFixed(1));
    el.setAttribute('x2', x2.toFixed(1)); el.setAttribute('y2', y2.toFixed(1));
  }

  // 两连杆逆运动学：求膝盖位置，返回 {kx, ky, fx, fy}
  function ik(hx, hy, tx, ty, sign) {
    var dx = tx - hx, dy = ty - hy, d0 = Math.hypot(dx, dy) || 1e-6;
    var d = Math.max(Math.abs(L1 - L2) + 1e-3, Math.min(L1 + L2 - 1e-3, d0));
    var ux = hx + dx / d0 * d, uy = hy + dy / d0 * d;
    var a = Math.atan2(uy - hy, ux - hx);
    var c = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    var A = Math.acos(Math.max(-1, Math.min(1, c)));
    var ang = a + sign * A;
    return { kx: hx + L1 * Math.cos(ang), ky: hy + L1 * Math.sin(ang), fx: ux, fy: uy };
  }

  function drawLeg(thigh, shank, foot, arm, ped, hx, hy, p) {
    var r = ik(hx, hy, p[0], p[1], -1);   // 膝盖向前弯（鸟类姿态）
    setLine(arm, CX, CY, r.fx, r.fy);
    setLine(ped, r.fx - 10, r.fy, r.fx + 10, r.fy);
    setLine(thigh, hx, hy, r.kx, r.ky);
    setLine(shank, r.kx, r.ky, r.fx, r.fy);
    foot.setAttribute('points',
      (r.fx - 8) + ',' + (r.fy + 1) + ' ' +
      (r.fx + 16) + ',' + (r.fy + 7) + ' ' +
      (r.fx - 3) + ',' + (r.fy + 10));
  }

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = performance.now();

  function frame(now) {
    var t = (now - t0) / 1000;

    // 车轮（比脚踏快一档，模拟变速）
    var wd = (t * 648) % 360;
    wheelR.setAttribute('transform', 'rotate(' + wd + ' 200 340)');
    wheelF.setAttribute('transform', 'rotate(' + wd + ' 430 340)');
    ring.setAttribute('transform', 'rotate(' + (t * 324 % 360) + ' 300 340)');

    // 脚踏曲柄
    var th = t * 2 * Math.PI * 0.9;
    var f1 = [CX + CR * Math.cos(th), CY + CR * Math.sin(th)];
    var f2 = [CX - CR * Math.cos(th), CY - CR * Math.sin(th)];

    // 身体随踩踏上下起伏 + 轻微俯仰
    var bob = 2.4 * Math.sin(2 * th - Math.PI / 2);
    var tilt = 1.3 * Math.sin(2 * th - Math.PI / 2);
    pel.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ') rotate(' + tilt.toFixed(2) + ' 300 260)');
    wing.setAttribute('transform', 'rotate(' + (9 * Math.sin(t * 2 * Math.PI * 1.1)).toFixed(2) + ' 292 250)');
    head.setAttribute('transform', 'rotate(' + (2.4 * Math.sin(t * 2 * Math.PI * 0.7)).toFixed(2) + ' 330 208)');

    drawLeg(tn, sn, fn, cn, pn, 278, 292 + bob, f1);
    drawLeg(tf, sf, ff, cf, pf, 266, 290 + bob, f2);

    // 路面与背景
    road.setAttribute('stroke-dashoffset', ((-t * 540) % 70).toFixed(1));
    for (var i = 0; i < clouds.length; i++) {
      var sp = 14 + i * 8;
      var x = 920 - ((t * sp + i * 430) % 1280);
      clouds[i].setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + (58 + i * 44) + ')');
    }
    for (var j = 0; j < streaks.length; j++) {
      var sx = 840 - ((t * 300 + j * 340) % 1020);
      setLine(streaks[j], sx, 0, sx - 52, 0);
    }

    requestAnimationFrame(frame);
  }

  if (reduced) { frame(t0 + 1200); }
  else { requestAnimationFrame(frame); }
})();
</script>
</body>
</html>
